<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Results</title>
    <style>
        body { padding: 10px; width: 100%; max-width: 600px; }
        textarea, #quizContainer { width: 100%; box-sizing: border-box; }
        .option { margin: 5px; padding: 10px; cursor: pointer; display: block; background-color: #f0f0f0; border: none; border-radius: 5px; }
        .correct { color: green; }
        .incorrect { color: red; }
    </style>
</head>
<body>
    <textarea id="resultsBox" style="display: none;" placeholder="Results will appear here..."></textarea>
    <div id="quizContainer" style="display: none;"></div>
    <script src="popup.js"></script>
</body>
</html>
